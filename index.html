      return;
    }

    const filter = searchInput.value.trim().toLowerCase();
    let total = 0;
    const catsToShow = activeTab === 'all' ? sortedCategories : [activeTab];
    for (const cat of catsToShow) {
      const commands = groups[cat].filter(([key]) => key.toLowerCase().includes(filter));
      if (commands.length === 0) continue;
      total += commands.length;
      const categoryDiv = document.createElement('div');
      categoryDiv.className = 'category';
      categoryDiv.innerHTML = `<h2>${cat}</h2>`;
      const listDiv = document.createElement('div');
      listDiv.className = 'command-list';

      });
      categoryDiv.appendChild(listDiv);
      container.appendChild(categoryDiv);
    }
    if (total === 0) {
      container.innerHTML = '<div class="no-results">😕 Ничего не найдено</div>';
    }
  }

  searchInput.addEventListener('input', renderAll);
